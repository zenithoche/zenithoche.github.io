<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ashiko Legal</title>
  <style>
:root {
  color-scheme: dark;
  --bg: #070707;
  --panel: #101010;
  --text: #f4f1ec;
  --muted: #bdb6ad;
  --line: #2a2927;
  --accent: #f4f1ec;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at top, rgba(255,255,255,.08), transparent 34rem),
    linear-gradient(180deg, #090909 0%, #050505 100%);
  color: var(--text);
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  line-height: 1.6;
}
main {
  width: min(920px, calc(100% - 32px));
  margin: 0 auto;
  padding: 56px 0 72px;
}
.card {
  background: rgba(16,16,16,.82);
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: clamp(24px, 5vw, 52px);
  box-shadow: 0 24px 80px rgba(0,0,0,.45);
}
h1, h2, h3 { line-height: 1.18; }
h1 {
  margin: 0 0 8px;
  font-size: clamp(2rem, 5vw, 4rem);
  letter-spacing: .08em;
  text-transform: uppercase;
}
h2 {
  margin-top: 2.2rem;
  padding-top: 1.4rem;
  border-top: 1px solid var(--line);
  font-size: 1.25rem;
}
p, li { color: var(--muted); }
a { color: var(--accent); }
.small {
  color: var(--muted);
  font-size: .95rem;
}
.nav {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  margin: 28px 0;
}
.nav a {
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 10px 14px;
  text-decoration: none;
  color: var(--text);
}
.brand {
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--muted);
  font-size: .85rem;
}
code {
  background: #171717;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 2px 6px;
  color: var(--text);
}
</style>
</head>
<body>
  <main>
    <section class="card">
      <div class="brand">Zenithoche</div>
      <h1>Ashiko Legal</h1>
      <p class="small">Simple legal links for Ashiko.</p>
      <div class="nav">
        <a href="./terms.html">Terms of Service</a>
        <a href="./privacy.html">Privacy Policy</a>
      </div>
      <p>
        Ashiko is a simple creator and streamer Discord app for AutoPost, Backdraft review, Hat Draws, and clean setup.
      </p>
    </section>
  </main>
</body>
</html>
