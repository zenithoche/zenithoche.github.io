name: Import Crafta continuity video

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-crafta-continuity-video.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download optimized continuity loop
        run: |
          set -euo pipefail
          mkdir -p assets/media
          curl -LfsS "https://d2ol7oe51mr4n9.cloudfront.net/user_3JyAcZdKeu73DBOIrwVBtd2tUGQ/bd7e6921-8728-4b3c-bab4-3d1026bcae22.mp4" -o assets/media/crafta-continuity-loop.mp4
          test -s assets/media/crafta-continuity-loop.mp4

      - name: Commit imported media
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/media/crafta-continuity-loop.mp4
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Host Crafta continuity background video"
          git push origin HEAD:main
